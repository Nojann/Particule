<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .atom { color: #1c1917; }
    @media (prefers-color-scheme: dark) {
      .atom { color: #e7e5e4; }
    }
  </style>
  <defs>
    <!-- Gap in the orbit around the particle, so it reads on any tab background -->
    <mask id="orbit-gap">
      <rect width="32" height="32" fill="white" />
      <circle cx="24.5" cy="7.5" r="6" fill="black" />
    </mask>
  </defs>
  <g class="atom" fill="currentColor">
    <!-- Orbit -->
    <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2.5" mask="url(#orbit-gap)" />
    <!-- Nucleus -->
    <circle cx="16" cy="16" r="5" />
    <!-- Particle, on the orbit -->
    <circle cx="24.5" cy="7.5" r="3.75" />
  </g>
</svg>
